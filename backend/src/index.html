
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Learning Path Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            font-weight: bold;
        }
        input, select, button {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            text-align: left;
        }
        .step {
            margin-top: 10px;
            padding: 10px;
            border-left: 4px solid #28a745;
            background: #fff;
            border-radius: 5px;
        }
        .step h3 {
            margin: 5px 0;
        }
        .step p {
            margin: 2px 0;
        }
        .step a {
            color: #007bff;
            text-decoration: none;
        }
        .step a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI-Powered Learning Path Generator</h1>
        <form id="learningPathForm">
            <label for="topic">Topic:</label>
            <input type="text" id="topic" name="topic" placeholder="e.g., Python, Web Development" required>

            <label for="time">Duration (Weeks):</label>
            <input type="number" id="time" name="time" placeholder="e.g., 4" required>

            <label for="knowledge_level">Knowledge Level:</label>
            <select id="knowledge_level" name="knowledge_level">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <button type="submit">Generate Learning Path</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById("learningPathForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const topic = document.getElementById("topic").value;
            const time = document.getElementById("time").value;
            const knowledge_level = document.getElementById("knowledge_level").value;

            // API call to backend
            try {
                const response = await fetch("http://127.0.0.1:5001/api/v1/roadmap", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ topic, time, knowledge_level })
                });

                const data = await response.json();

                // Display the results
                const resultDiv = document.getElementById("result");
                resultDiv.innerHTML = ""; // Clear previous results

                if (data.error) {
                    resultDiv.innerHTML = `<p style="color:red;">Error: ${data.error}</p>`;
                    return;
                }

                const roadmap = data.roadmap;
                resultDiv.innerHTML = `<h2>Learning Path for ${roadmap.topic}</h2>`;

                roadmap.steps.forEach((step, index) => {
                    const stepDiv = document.createElement("div");
                    stepDiv.classList.add("step");
                    stepDiv.innerHTML = `
                        <h3>Step ${index + 1}: ${step.title}</h3>
                        <p><strong>Duration:</strong> ${step.duration}</p>
                        <p><strong>Description:</strong> ${step.description}</p>
                        <p><strong>Resources:</strong></p>
                        <ul>
                            ${step.resources.map(resource => `<li><a href="${resource.link}" target="_blank">${resource.type}</a></li>`).join("")}
                        </ul>
                    `;
                    resultDiv.appendChild(stepDiv);
                });
            } catch (error) {
                document.getElementById("result").innerHTML = `<p style="color:red;">Failed to generate roadmap.</p>`;
            }
        });
    </script>
</body>
</html>
